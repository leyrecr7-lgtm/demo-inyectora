<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" role="img" aria-labelledby="title desc">
  <title id="title">Fases temporales sin ruido previo</title>
  <desc id="desc">Grafica temporal del audio test11 con las fases Cierre, Carga, Retroceso y Apertura.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 800; }
    .axis { font-size: 18px; font-weight: 700; fill: #5c6675; }
    .tick { font-size: 16px; fill: #5c6675; }
    .grid { stroke: #d9e1ec; stroke-width: 1; }
    .line { fill: none; stroke: #1f57b6; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <rect width="980" height="620" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" class="title">Fases temporales - test11.wav</text>

  <rect x="150" y="70" width="760" height="430" fill="#ffffff" stroke="#5c6675" stroke-width="1.5"/>

  <g class="grid">
    <line x1="150" y1="393" x2="910" y2="393"/>
    <line x1="150" y1="285" x2="910" y2="285"/>
    <line x1="150" y1="178" x2="910" y2="178"/>
    <line x1="150" y1="70" x2="910" y2="70"/>

    <line x1="150" y1="70" x2="150" y2="500"/>
    <line x1="246" y1="70" x2="246" y2="500"/>
    <line x1="342" y1="70" x2="342" y2="500"/>
    <line x1="438" y1="70" x2="438" y2="500"/>
    <line x1="534" y1="70" x2="534" y2="500"/>
    <line x1="630" y1="70" x2="630" y2="500"/>
    <line x1="726" y1="70" x2="726" y2="500"/>
    <line x1="822" y1="70" x2="822" y2="500"/>
  </g>

  <text x="134" y="398" text-anchor="end" class="tick">Cierre</text>
  <text x="134" y="290" text-anchor="end" class="tick">Carga</text>
  <text x="134" y="183" text-anchor="end" class="tick">Retroceso</text>
  <text x="134" y="75" text-anchor="end" class="tick">Apertura</text>

  <text x="150" y="530" text-anchor="middle" class="tick">0</text>
  <text x="246" y="530" text-anchor="middle" class="tick">5</text>
  <text x="342" y="530" text-anchor="middle" class="tick">10</text>
  <text x="438" y="530" text-anchor="middle" class="tick">15</text>
  <text x="534" y="530" text-anchor="middle" class="tick">20</text>
  <text x="630" y="530" text-anchor="middle" class="tick">25</text>
  <text x="726" y="530" text-anchor="middle" class="tick">30</text>
  <text x="822" y="530" text-anchor="middle" class="tick">35</text>
  <text x="910" y="530" text-anchor="middle" class="tick">39.6</text>

  <text x="530" y="575" text-anchor="middle" class="axis">Tiempo (s)</text>
  <text x="42" y="285" text-anchor="middle" class="axis" transform="rotate(-90 42 285)">Fase temporal</text>

  <path class="line" d="M150 393 H423 V285 H526 V178 H672 V70 H910"/>

  <circle cx="423" cy="393" r="5" fill="#1f57b6"/>
  <circle cx="423" cy="285" r="5" fill="#1f57b6"/>
  <circle cx="526" cy="285" r="5" fill="#1f57b6"/>
  <circle cx="526" cy="178" r="5" fill="#1f57b6"/>
  <circle cx="672" cy="178" r="5" fill="#1f57b6"/>
  <circle cx="672" cy="70" r="5" fill="#1f57b6"/>

  <g>
    <rect x="175" y="420" width="222" height="42" rx="6" fill="#f4f7fb" stroke="#d9e1ec"/>
    <text x="286" y="446" text-anchor="middle" class="tick">Cierre: 14.2 s</text>
    <rect x="425" y="312" width="98" height="42" rx="6" fill="#fff7df" stroke="#ffd32a"/>
    <text x="474" y="338" text-anchor="middle" class="tick">Carga: 5.4 s</text>
    <rect x="533" y="205" width="132" height="42" rx="6" fill="#e5f7fb" stroke="#00a9c7"/>
    <text x="599" y="231" text-anchor="middle" class="tick">Retroceso: 7.6 s</text>
    <rect x="685" y="97" width="196" height="42" rx="6" fill="#eef3ff" stroke="#1f57b6"/>
    <text x="783" y="123" text-anchor="middle" class="tick">Apertura: 12.4 s</text>
  </g>
</svg>


