<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">Matriz de confusion sin ruido previo</title>
  <desc id="desc">Matriz de confusion del clasificador con las clases Cierre, Carga, Retroceso y Apertura.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 800; }
    .axis { font-size: 17px; font-weight: 700; fill: #5c6675; }
    .label { font-size: 16px; fill: #5c6675; }
    .count { font-size: 25px; font-weight: 800; }
    .small { font-size: 15px; font-weight: 700; }
    .white { fill: #ffffff; }
    .muted { fill: #5c6675; }
  </style>

  <rect width="980" height="640" fill="#ffffff"/>
  <text x="490" y="38" text-anchor="middle" class="title">Clasificador acustico de fases</text>

  <text x="382" y="586" text-anchor="middle" class="axis">Fase predicha</text>
  <text x="32" y="310" text-anchor="middle" class="axis" transform="rotate(-90 32 310)">Fase real</text>

  <text x="145" y="128" text-anchor="end" class="label">Cierre</text>
  <text x="145" y="248" text-anchor="end" class="label">Carga</text>
  <text x="145" y="368" text-anchor="end" class="label">Retroceso</text>
  <text x="145" y="488" text-anchor="end" class="label">Apertura</text>

  <text x="230" y="556" text-anchor="middle" class="label">Cierre</text>
  <text x="350" y="556" text-anchor="middle" class="label">Carga</text>
  <text x="470" y="556" text-anchor="middle" class="label">Retroceso</text>
  <text x="590" y="556" text-anchor="middle" class="label">Apertura</text>

  <g stroke="#172033" stroke-width="1">
    <rect x="170" y="80" width="120" height="120" fill="#1576bd"/>
    <rect x="290" y="80" width="120" height="120" fill="#f5d7c2"/>
    <rect x="410" y="80" width="120" height="120" fill="#f5d7c2"/>
    <rect x="530" y="80" width="120" height="120" fill="#efc6ad"/>

    <rect x="170" y="200" width="120" height="120" fill="#f0cbb5"/>
    <rect x="290" y="200" width="120" height="120" fill="#77add5"/>
    <rect x="410" y="200" width="120" height="120" fill="#f8e1d0"/>
    <rect x="530" y="200" width="120" height="120" fill="#fff7ef"/>

    <rect x="170" y="320" width="120" height="120" fill="#f7dcc9"/>
    <rect x="290" y="320" width="120" height="120" fill="#f8e1d0"/>
    <rect x="410" y="320" width="120" height="120" fill="#5e9fd0"/>
    <rect x="530" y="320" width="120" height="120" fill="#f5d7c2"/>

    <rect x="170" y="440" width="120" height="120" fill="#f0cbb5"/>
    <rect x="290" y="440" width="120" height="120" fill="#fff1e8"/>
    <rect x="410" y="440" width="120" height="120" fill="#f7dcc9"/>
    <rect x="530" y="440" width="120" height="120" fill="#70a9d3"/>
  </g>

  <text x="230" y="150" text-anchor="middle" class="count white">701</text>
  <text x="350" y="150" text-anchor="middle" class="count">15</text>
  <text x="470" y="150" text-anchor="middle" class="count">14</text>
  <text x="590" y="150" text-anchor="middle" class="count">42</text>

  <text x="230" y="270" text-anchor="middle" class="count">34</text>
  <text x="350" y="270" text-anchor="middle" class="count">266</text>
  <text x="470" y="270" text-anchor="middle" class="count">10</text>
  <text x="590" y="270" text-anchor="middle" class="count">1</text>

  <text x="230" y="390" text-anchor="middle" class="count">16</text>
  <text x="350" y="390" text-anchor="middle" class="count">13</text>
  <text x="470" y="390" text-anchor="middle" class="count">389</text>
  <text x="590" y="390" text-anchor="middle" class="count">17</text>

  <text x="230" y="510" text-anchor="middle" class="count">36</text>
  <text x="350" y="510" text-anchor="middle" class="count">2</text>
  <text x="470" y="510" text-anchor="middle" class="count">11</text>
  <text x="590" y="510" text-anchor="middle" class="count">337</text>

  <text x="754" y="70" text-anchor="middle" class="small muted">Recall por fase</text>
  <g stroke="#172033" stroke-width="1">
    <rect x="690" y="80" width="130" height="120" fill="#1576bd"/>
    <rect x="820" y="80" width="100" height="120" fill="#f0cbb5"/>
    <rect x="690" y="200" width="130" height="120" fill="#2d86c5"/>
    <rect x="820" y="200" width="100" height="120" fill="#f4d5c0"/>
    <rect x="690" y="320" width="130" height="120" fill="#1f7ec0"/>
    <rect x="820" y="320" width="100" height="120" fill="#f1cdb6"/>
    <rect x="690" y="440" width="130" height="120" fill="#2784c3"/>
    <rect x="820" y="440" width="100" height="120" fill="#f3d3bd"/>
  </g>
  <text x="755" y="150" text-anchor="middle" class="count white">90.8%</text>
  <text x="870" y="150" text-anchor="middle" class="count">9.2%</text>
  <text x="755" y="270" text-anchor="middle" class="count white">85.5%</text>
  <text x="870" y="270" text-anchor="middle" class="count">14.5%</text>
  <text x="755" y="390" text-anchor="middle" class="count white">89.4%</text>
  <text x="870" y="390" text-anchor="middle" class="count">10.6%</text>
  <text x="755" y="510" text-anchor="middle" class="count white">87.3%</text>
  <text x="870" y="510" text-anchor="middle" class="count">12.7%</text>

  <text x="382" y="612" text-anchor="middle" class="small muted">Precision por fase: Cierre 89.1% - Carga 89.9% - Retroceso 91.7% - Apertura 84.9%</text>
</svg>


